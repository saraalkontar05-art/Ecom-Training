<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="	https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <style>
      .link-forgot-password:hover {
        color: #0ba9ed;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row">
        <div class="col-lg-6">
          <div class="mt-3 ps-lg-5">
            <h3 class="text-blue-500 fs-32 fw-bold">Member Login</h3>
            <p class="text-blue-300">Welcome back!</p>
            <form action="">
              <div class="d-flex flex-column">
                <label class="fs-14 text-blue-400" for="info-user"
                  >Email /Phone /Username*</label
                >
                <input
                  class="border rounded p-3 mb-3 mt-2"
                  type="text"
                  id="info-user"
                  placeholder="stevenjob@gmail.com"
                />
              </div>
              <div class="d-flex flex-column">
                <label class="fs-14 text-blue-400" for="password"
                  >Password*</label
                >
                <input
                  class="border rounded p-3 mb-3 mt-2"
                  type="password"
                  id="password"
                  placeholder="******************"
                />
              </div>
              <div class="d-flex justify-content-between mt-2 mb-2">
                <div class="d-flex gap-2">
                  <input type="checkbox" id="remember" />
                  <label class="fs-14 text-blue-300">Remember me</label>
                </div>
                <a
                  class="link-forgot-password text-decoration-none text-blue-300 fs-14"
                  href=""
                  >Forgot your password?</a
                >
              </div>
              <button class="w-100 sign-up mt-3 p-3">Sign up</button>
              <p class="text-blue-300 fs-12 mt-3">
                Have not an account?
                <a
                  class="text-decoration-none text-blue-500"
                  href="./register.html"
                  >Sign Up</a
                >
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
