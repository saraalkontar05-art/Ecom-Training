<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="	https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container p-5">
      <div class="row">
        <div class="col-lg-6">
          <div class="mt-3 px-5">
            <h3 class="text-blue-500 fs-32 fw-bold">Create an account</h3>
            <p class="text-blue-300">
              Access to all features. No credit card required.
            </p>
            <form action="">
              <div class="d-flex flex-column">
                <label class="fs-14 text-blue-400" for="name">Full Name*</label>
                <input
                  class="border rounded p-3 mb-3 mt-2"
                  type="text"
                  id="name"
                  placeholder="Steven job"
                />
              </div>
              <div class="d-flex flex-column">
                <label class="fs-14 text-blue-400" for="email">Email*</label>
                <input
                  class="border rounded p-3 mb-3 mt-2"
                  type="email"
                  id="email"
                  placeholder="stevenjob@gmail.com"
                />
              </div>
              <div class="d-flex flex-column">
                <label class="fs-14 text-blue-400" for="user">Username*</label>
                <input
                  class="border rounded p-3 mb-3 mt-2"
                  type="text"
                  id="user"
                  placeholder="stevenjob"
                />
              </div>
              <div class="d-flex flex-column">
                <label class="fs-14 text-blue-400" for="password"
                  >Password*</label
                >
                <input
                  class="border rounded p-3 mb-3 mt-2"
                  type="password"
                  id="password"
                  placeholder="******************"
                />
              </div>
              <div class="d-flex flex-column">
                <label class="fs-14 text-blue-400" for="re-password"
                  >R-Password</label
                >
                <input
                  class="border rounded p-3 mb-3 mt-2"
                  type="password"
                  id="re-password"
                  placeholder="******************"
                />
              </div>
              <div class="d-flex gap-2 mt-2">
                <input type="checkbox" id="re-password" />
                <label class="fs-14 text-blue-500"
                  >By clicking Register button, you agree our terms and
                  policy,</label
                >
              </div>
              <button class="w-100 sign-up mt-3 p-3">Sign up</button>
              <p class="text-blue-300 fs-12 mt-3">
                Already have an account?
                <a
                  class="text-decoration-none text-blue-500"
                  href="./login.html"
                  >Sign Up</a
                >
              </p>
            </form>
          </div>
        </div>
        <div class="col-lg-6 text-center p-5">
          <div class="mt-3">
            <h5 class="text-blue-500 fw-bold mb-5">
              Use Social Network Account
            </h5>
            <div class="position-relative border rounded p-3">
              <span class="text-blue-500 fw-bold"
                >Sign up with &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <span style="color: red">oogle</span></span
              >
              <div
                style="top: 29%; left: 54%"
                class="icon-four-color position-absolute"
              >
                <i class="bi bi-google"></i><i class="bi bi-google"></i
                ><i class="bi bi-google"></i><i class="bi bi-google"></i>
              </div>
            </div>
            <div class="border rounded p-3 mt-3">
              <span class="text-blue-500 fw-bold"
                >Sign up with<span style="color: #3aa1ff">Facebook</span></span
              >
            </div>
            <div class="border rounded p-3 mt-3">
              <span class="text-blue-500 fw-bold"
                >Sign up with <img src="./amazon.svg" alt=""
              /></span>
            </div>
            <p class="text-blue-500 fs-12 mt-4">
              Buying for work?
              <a class="text-decoration-none text-sky-500" href=""
                >Creat a free business account</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
